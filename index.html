<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abstract Parallax Experience</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <canvas id="webgl-background"></canvas>
    <div class="container">
        <div class="parallax-layer layer1"></div>
        <div class="parallax-layer layer2"></div>

        <div class="content">
            <h1 class="fluid-text">Abstract Generative Experience</h1>
            <p class="dynamic-text">Enter a world of fluid motion and dynamic art.</p>
        </div>
    </div>
</body>
</html>
